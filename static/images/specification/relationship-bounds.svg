<title id="title">RELATIONSHIP BOUNDS — READING BOTH ENDS</title><desc id="desc">Witness PART_OF Letter. At the Witness end, from.bounds 0..* counts witnesses per letter. At the Letter end, to.bounds 1..1 counts letters per witness. These are an example project rule.</desc>
